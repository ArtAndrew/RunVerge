# SPDX-License-Identifier: Elastic-2.0
name: Linux server preview
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: linux-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    name: Linux ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            machine: x86_64
          - arch: arm64
            runner: ubuntu-24.04-arm
            machine: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      EXPECTED_ARCH: ${{ matrix.arch }}
      EXPECTED_MACHINE: ${{ matrix.machine }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require a native host and Docker daemon
        run: |
          test "$(uname -s)" = Linux
          test "$(uname -m)" = "$EXPECTED_MACHINE"
          test "$(docker info --format '{{.Architecture}}')" = "$EXPECTED_MACHINE"
      - name: Private settings helper checks
        run: |
          python3 -m unittest discover -s tests/development -p test_server_setup.py -v
          python3 -m unittest discover -s tests/development -p test_model_key.py -v
          python3 -m unittest discover -s tests/development -p test_openrouter_probe.py -v
      - name: Build and verify a native Linux installation
        run: docker build --target runtime --tag runverge:linux-preview .
      - name: Require the target image architecture
        run: test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' runverge:linux-preview)" = "linux/$EXPECTED_ARCH"
      - name: Verify private runtime directory metadata
        run: |
          python3 - <<'PY'
          import json, subprocess, tarfile, tempfile
          from pathlib import Path
          container = subprocess.check_output(['docker', 'create', 'runverge:linux-preview', 'version'], text=True).strip()
          try:
              with tempfile.TemporaryDirectory() as root:
                  archive = Path(root) / 'runtime.tar'
                  subprocess.run(['docker', 'export', '--output', str(archive), container], check=True, capture_output=True)
                  with tarfile.open(archive) as tar:
                      state = next(item for item in tar if item.name.rstrip('/') == 'state')
                  print(json.dumps({'state_directory_mode': oct(state.mode), 'state_uid': state.uid, 'state_gid': state.gid}))
                  assert state.isdir() and state.uid == 10001 and state.gid == 10001 and state.mode & 0o077 == 0
          finally:
              subprocess.run(['docker', 'rm', '-f', container], check=True, capture_output=True)
          PY
      - name: Check Compose, separate worker and restart
        run: python3 scripts/verify_server_container.py --evidence "$RUNNER_TEMP/runverge-evidence/compose.json"
      - name: Classify deployment errors without exposing private logs
        if: failure()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          labels = {
              'private_profile_directory': 'output requires a new file in an existing private directory owned by you',
              'profile_rate_or_limit': 'profile limits are invalid',
              'profile_command_arguments': 'usage: platform prepare-model',
              'private_profile_parse': 'invalid private model configuration',
              'profile_installation': 'model installation rejected',
              'profile_catalogue': 'offline openrouter profile installation changed limits',
          }
          found = set()
          for root in Path('/tmp').glob('runverge-compose-check-*'):
              for log in root.glob('command-*.log'):
                  body = log.read_text(errors='replace').lower()
                  found.update(label for label, text in labels.items() if text in body)
          print(json.dumps({'fixed_error_classifications': sorted(found)}))
          PY
      - name: Export native verification evidence
        if: always()
        run: docker build --target evidence --output "type=local,dest=$RUNNER_TEMP/runverge-evidence/native" .
      - name: Bind architecture to installation and restart results
        run: |
          python3 - <<'PY'
          import json, os, platform, subprocess
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'runverge-evidence'
          build = json.loads((root / 'native/build-report.json').read_text())
          native = json.loads((root / 'native/linux-native-smoke.json').read_text())
          compose = json.loads((root / 'compose.json').read_text())
          identity = build['identity']
          assert identity['os'] == 'linux' and identity['arch'] == os.environ['EXPECTED_ARCH']
          assert native['identity'] == identity
          assert native['passed'] and native['cleanup_complete']
          assert compose['passed'] and compose['cleanup_complete']
          image_id = subprocess.check_output(['docker', 'image', 'inspect', '--format', '{{.Id}}', 'runverge:linux-preview'], text=True).strip()
          report = {'scope': 'native_linux_source_and_compose_preview', 'passed': True,
                    'host_machine': platform.machine(), 'arch': identity['arch'],
                    'source_sha256': identity['source_sha256'], 'image_id': image_id,
                    'native_steps': len(native['steps']), 'compose_steps': len(compose['steps']),
                    'real_model_called': False}
          (root / 'architecture.json').write_text(json.dumps(report, indent=2) + '\n')
          print(json.dumps(report))
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: linux-${{ matrix.arch }}-verification
          path: ${{ runner.temp }}/runverge-evidence
          if-no-files-found: ignore
          retention-days: 3
