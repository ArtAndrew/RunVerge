# SPDX-License-Identifier: Elastic-2.0
name: Recovery validation candidate
on:
  workflow_dispatch:
    inputs:
      schema_reference:
        description: 'Capture trusted schema metadata only; this is NOT validation acceptance'
        type: boolean
        default: false
  pull_request:
    paths:
      - 'internal/storage/recovery_*'
      - 'internal/recoveryaccess/**'
      - 'internal/modelruntime/intent_snapshot*'
      - '.github/workflows/recovery-candidate.yml'
permissions:
  contents: read
jobs:
  recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container: golang:1.27.3-bookworm@sha256:df4bb0305771186a85d0fd3a40f5c5da9af97ac8053d391ffce2c070817a20c6
    services:
      postgres:
        image: postgres:18.6-bookworm@sha256:5c4783a8cc3f0074912164f94dfa1be4e043438f0f707cf968d7af9a0d31a2c8
        env:
          POSTGRES_USER: runverge
          POSTGRES_PASSWORD: synthetic-recovery-ci-only
          POSTGRES_DB: postgres
          POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C
        options: >-
          --health-cmd "pg_isready -U runverge -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgres://runverge:synthetic-recovery-ci-only@postgres:5432/postgres?sslmode=disable
      RUNVERGE_RECOVERY_OWNED_PG: '1'
      RUNVERGE_RECOVERY_INDEPENDENT_OWNED_PG: '1'
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check model intent serialization and recovery snapshot validation
        if: ${{ !inputs.schema_reference }}
        run: |
          go test -mod=readonly ./internal/modelruntime -count=1
          go test -mod=readonly -race ./internal/recoveryaccess -count=1 -v
          go test -mod=readonly ./internal/storage -run 'TestRecovery(ReaderAuthor|GateAuthor|GateIndependent|SnapshotTrustedInventory|SemanticCatalogTrusted|ImportAuthor|ImportIndependent|ModelStage|ModelHistory|ExecutionHistory|StageAuthor|StageIndependent|TeamHistory|ConfigurationHistory|AuthorityHistory|HistoryJSON|HistoryCoverage|CostHistory|Allocations|WebhookProfiles)' -count=1 -v
      - name: Capture unsealed schema reference metadata only
        if: ${{ inputs.schema_reference }}
        run: |
          mkdir recovery-reference
          go test -mod=readonly ./internal/storage -run '^TestRecoverySnapshotTrustedInventory$' -count=1 -v -recovery-snapshot-inventory-output="$GITHUB_WORKSPACE/recovery-reference/inventory.json"
          go test -mod=readonly ./internal/storage -run '^TestRecoverySemanticCatalogTrusted$' -count=1 -v -recovery-semantic-catalog-output="$GITHUB_WORKSPACE/recovery-reference/catalog.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ inputs.schema_reference }}
        with:
          name: recovery-schema-reference
          path: recovery-reference/*.json
          if-no-files-found: error
          retention-days: 3
