# SPDX-License-Identifier: Elastic-2.0
name: Local model team and MCP pilot
on:
  workflow_dispatch:
  # Temporary bootstrap until the checked workflow is available on main.
  pull_request:
    paths:
      - '.github/workflows/team-model-pilot.yml'
      - 'scripts/run_team_model_pilot.py'
      - 'scripts/verify_team_model_mcp.py'
      - 'scripts/verify_mcp_read.py'
permissions:
  contents: read
concurrency:
  group: team-model-pilot-${{ github.ref }}
  cancel-in-progress: true
jobs:
  local-model:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Build the owned native pilot environment
        run: docker build --target model-pilot-runtime --tag runverge:team-model-pilot .
      - name: Fetch and verify the official pinned engine
        run: |
          mkdir "$RUNNER_TEMP/ollama-pinned"
          curl --fail --location --retry 2 --max-time 600 \
            --output "$RUNNER_TEMP/ollama-linux-amd64.tar.zst" \
            https://github.com/ollama/ollama/releases/download/v0.40.11/ollama-linux-amd64.tar.zst
          printf '%s  %s\n' 7bedab90dd122661be78798e9f0edf37fccf0cccf2699d2c58ea1a3afdc04b6d "$RUNNER_TEMP/ollama-linux-amd64.tar.zst" | sha256sum --check
          tar --zstd --no-same-owner -xf "$RUNNER_TEMP/ollama-linux-amd64.tar.zst" -C "$RUNNER_TEMP/ollama-pinned"
          rm "$RUNNER_TEMP/ollama-linux-amd64.tar.zst"
      - name: Run local model and MCP with synthetic data only
        run: |
          container="runverge-team-model-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker create --name "$container" --cpus 2 --memory 6g --pids-limit 256 \
            --mount "type=bind,src=$RUNNER_TEMP/ollama-pinned,dst=/opt/ollama,readonly" \
            runverge:team-model-pilot python3 /src/runverge/scripts/run_team_model_pilot.py \
            --ollama /opt/ollama/bin/ollama --output /tmp/team-model-evidence
          set +e
          docker start --attach "$container"
          result=$?
          set -e
          docker cp "$container:/tmp/team-model-evidence" "$RUNNER_TEMP/team-model-evidence"
          test "$(docker inspect --format '{{.State.Running}}' "$container")" = false
          exit "$result"
      - name: Remove the owned pilot container
        if: always()
        run: |
          container="runverge-team-model-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if docker inspect "$container" >/dev/null 2>&1; then
            docker rm --force "$container"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: local-model-team-mcp
          path: ${{ runner.temp }}/team-model-evidence
          if-no-files-found: ignore
          retention-days: 3
