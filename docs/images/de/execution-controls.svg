<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc" lang="de">
<title id="title">Aufgabenbudget und Anfragestatus</title><desc id="desc">Vor einem Versuch werden Rechte, Budget und Grenzen geprüft. Budget wird nach den konfigurierten Preisen reserviert. Bestätigte Kosten werden getrennt erfasst; bei ungewissem Ausgang bleibt die Reservierung bestehen. Sie ist ein interner Budgeteintrag, keine Banksperre.</desc>
<rect x="1" y="1" width="1198" height="518" rx="22" fill="#f5f8f6" stroke="#d8e4dd" />
<g font-family="Arial, Helvetica, sans-serif">
<text x="42" y="59" font-size="34" font-weight="700" fill="#18352c" data-label="2" data-left="42" data-right="1158">Vor dem Start ein Budget festlegen</text><text x="42" y="99" font-size="22" fill="#536c61" data-label="3" data-left="42" data-right="1158">Kosten und noch zu prüfende Beträge sehen.</text>
<g fill="#ffffff" stroke="#d8e4dd"><rect x="42" y="140" width="350" height="185" rx="14" /><rect x="425" y="140" width="350" height="185" rx="14" /><rect x="808" y="140" width="350" height="185" rx="14" /></g>
<g fill="#478469" font-size="17" font-weight="700" letter-spacing="1"><text x="65" y="174" font-size="17" data-label="4" data-left="65" data-right="369">VORHER</text><text x="448" y="174" font-size="17" data-label="5" data-left="448" data-right="752">WÄHRENDDESSEN</text><text x="831" y="174" font-size="17" data-label="6" data-left="831" data-right="1135">DANACH</text></g>
<g fill="#18352c" font-size="26" font-weight="700"><text x="65" y="219" font-size="26" data-label="7" data-left="65" data-right="369">Rechte und Grenzen</text><text x="448" y="219" font-size="26" data-label="8" data-left="448" data-right="752">Budget reservieren</text><text x="831" y="219" font-size="26" data-label="9" data-left="831" data-right="1135">Kosten prüfen</text></g>
<g fill="#536c61" font-size="20"><text x="65" y="260" font-size="20" data-label="10" data-left="65" data-right="369">Aufgabenbudget, Versuche</text><text x="65" y="292" font-size="20" data-label="11" data-left="65" data-right="369">und Frist prüfen.</text><text x="448" y="260" font-size="20" data-label="12" data-left="448" data-right="752">Konfigurierte Preise und</text><text x="448" y="292" font-size="20" data-label="13" data-left="448" data-right="752">Kostenobergrenze verwenden.</text><text x="831" y="260" font-size="20" data-label="14" data-left="831" data-right="1135">Bestätigte Kosten erfassen,</text><text x="831" y="292" font-size="20" data-label="15" data-left="831" data-right="1135">ungewisse Fälle getrennt halten.</text></g>
<rect x="42" y="357" width="1116" height="78" rx="12" fill="#fff3db" stroke="#e7d4a8" /><text x="65" y="389" font-size="22" font-weight="700" fill="#725321" data-label="16" data-left="65" data-right="1135">Ausgang der gesendeten Anfrage unklar? Reservierung behalten.</text><text x="65" y="418" font-size="20" fill="#725321" data-label="17" data-left="65" data-right="1135">Die Plattform sendet diese Anfrage nicht automatisch erneut.</text>
<text x="42" y="480" font-size="19" fill="#536c61" data-label="18" data-left="42" data-right="1158">Ein lokaler API-Tarif von null bedeutet weder kostenlose Hardware noch ein bestätigtes Ergebnis.</text>
</g></svg>
