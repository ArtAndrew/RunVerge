<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc" lang="es">
<title id="title">Cómo funciona RunVerge</title>
<desc id="desc">Describe una tarea, obtén un borrador, revísalo y acéptalo o autoriza una revisión. Las respuestas originales y los comentarios se conservan en el historial.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#10252c" /><stop offset="1" stop-color="#183c38" /></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L7 4L0 8" fill="none" stroke="#75c9a5" stroke-width="1.5" /></marker></defs>
<rect width="1200" height="680" rx="24" fill="url(#bg)" />
<g font-family="Arial, Helvetica, sans-serif">
<path d="M48 60V38M59 66V32M70 60V26" stroke="#77e0b3" stroke-width="7" stroke-linecap="round" />
<text x="90" y="57" fill="#d5f7e9" font-size="28" font-weight="700" data-label="2" data-left="90" data-right="350">RunVerge</text>
<rect x="918" y="30" width="234" height="40" rx="20" fill="#284d45" /><text x="1035" y="56" text-anchor="middle" fill="#a9e8cd" font-size="17" font-weight="700" data-label="3" data-left="930" data-right="1140">ALPHA.2 / PRUEBA</text>
<text x="48" y="138" fill="#ffffff" font-size="40" font-weight="700" data-label="4" data-left="48" data-right="1152">Asigna una tarea. Revisa el resultado.</text>
<text x="48" y="183" fill="#b6d3ca" font-size="25" data-label="5" data-left="48" data-right="1152">Conserva las respuestas y los comentarios para corregirlas.</text>
<g fill="#193b3b" stroke="#3a6158"><rect x="48" y="237" width="196" height="162" rx="16" /><rect x="275" y="237" width="196" height="162" rx="16" /><rect x="502" y="237" width="196" height="162" rx="16" /><rect x="729" y="237" width="196" height="162" rx="16" /><rect x="956" y="237" width="196" height="162" rx="16" /></g>
<g fill="#8de2bb" font-size="19" font-weight="700"><text x="69" y="272" font-size="19" data-label="6" data-left="69" data-right="230">01 / DESCRIBE</text><text x="296" y="272" font-size="19" data-label="7" data-left="296" data-right="457">02 / GENERA</text><text x="523" y="272" font-size="19" data-label="8" data-left="523" data-right="684">03 / REVISA</text><text x="750" y="272" font-size="19" data-label="9" data-left="750" data-right="911">04 / OPCIONAL</text><text x="977" y="272" font-size="19" data-label="10" data-left="977" data-right="1138">05 / DECIDE</text></g>
<g fill="#ffffff" font-size="26" font-weight="700"><text x="69" y="321" font-size="25" data-label="11" data-left="69" data-right="230">Tarea y límite</text><text x="296" y="321" font-size="26" data-label="12" data-left="296" data-right="457">Borrador</text><text x="523" y="321" font-size="26" data-label="13" data-left="523" data-right="684">Tu revisión</text><text x="750" y="321" font-size="26" data-label="14" data-left="750" data-right="911">Corregir</text><text x="977" y="321" font-size="26" data-label="15" data-left="977" data-right="1138">Tu decisión</text></g>
<g fill="#b6d3ca" font-size="20"><text x="69" y="362" font-size="20" data-label="16" data-left="69" data-right="230">Define el objetivo</text><text x="296" y="362" font-size="20" data-label="17" data-left="296" data-right="457">Guarda el texto</text><text x="523" y="362" font-size="20" data-label="18" data-left="523" data-right="684">Verifica los datos</text><text x="750" y="362" font-size="20" data-label="19" data-left="750" data-right="911">Autoriza el intento</text><text x="977" y="362" font-size="20" data-label="20" data-left="977" data-right="1138">Acepta o rechaza</text></g>
<g stroke="#75c9a5" stroke-width="2" marker-end="url(#arrow)"><path d="M248 318H267" /><path d="M475 318H494" /><path d="M702 318H721" /><path d="M929 318H948" /></g>
<text x="48" y="441" fill="#b6d3ca" font-size="21" data-label="21" data-left="48" data-right="1152">Acepta el borrador o deja comentarios y autoriza otro intento.</text><path d="M48 479H1152" stroke="#36594f" />
<g fill="#ffffff" font-size="24" font-weight="700"><text x="48" y="533" font-size="24" data-label="22" data-left="48" data-right="378">Conserva las versiones</text><text x="427" y="533" font-size="24" data-label="23" data-left="427" data-right="757">Fija un presupuesto</text><text x="806" y="533" font-size="24" data-label="24" data-left="806" data-right="1136">Tu instalación</text></g>
<g fill="#b6d3ca" font-size="20"><text x="48" y="570" font-size="20" data-label="25" data-left="48" data-right="378">La respuesta original sigue</text><text x="48" y="601" font-size="20" data-label="26" data-left="48" data-right="378">disponible tras la revisión.</text><text x="427" y="570" font-size="20" data-label="27" data-left="427" data-right="757">Consulta cargos e importes</text><text x="427" y="601" font-size="20" data-label="28" data-left="427" data-right="757">pendientes de confirmación.</text><text x="806" y="570" font-size="20" data-label="29" data-left="806" data-right="1136">Trabaja con tus agentes</text><text x="806" y="601" font-size="20" data-label="30" data-left="806" data-right="1136">desde el navegador.</text></g>
<text x="48" y="648" fill="#a5c8ba" font-size="16" data-label="31" data-left="48" data-right="1152">Paquete alpha.2 verificado: macOS arm64 · un propietario · datos de prueba · PostgreSQL y modelo se instalan aparte</text>
</g></svg>
