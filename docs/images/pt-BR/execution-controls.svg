<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc" lang="pt-BR">
<title id="title">Orçamento e estado da solicitação</title><desc id="desc">Antes da execução, verificam-se permissões, orçamento e limites. O orçamento é reservado conforme os preços configurados. O custo é confirmado separadamente; se o resultado for incerto, a reserva permanece. É um registro interno, não um bloqueio bancário.</desc>
<rect x="1" y="1" width="1198" height="518" rx="22" fill="#f5f8f6" stroke="#d8e4dd" />
<g font-family="Arial, Helvetica, sans-serif">
<text x="42" y="59" font-size="34" font-weight="700" fill="#18352c" data-label="2" data-left="42" data-right="1158">Defina o orçamento antes de começar</text><text x="42" y="99" font-size="22" fill="#536c61" data-label="3" data-left="42" data-right="1158">Veja o que foi gasto e o que ainda precisa de conferência.</text>
<g fill="#ffffff" stroke="#d8e4dd"><rect x="42" y="140" width="350" height="185" rx="14" /><rect x="425" y="140" width="350" height="185" rx="14" /><rect x="808" y="140" width="350" height="185" rx="14" /></g>
<g fill="#478469" font-size="17" font-weight="700" letter-spacing="1"><text x="65" y="174" font-size="17" data-label="4" data-left="65" data-right="369">ANTES</text><text x="448" y="174" font-size="17" data-label="5" data-left="448" data-right="752">DURANTE</text><text x="831" y="174" font-size="17" data-label="6" data-left="831" data-right="1135">DEPOIS</text></g>
<g fill="#18352c" font-size="26" font-weight="700"><text x="65" y="219" font-size="26" data-label="7" data-left="65" data-right="369">Acesso e limites</text><text x="448" y="219" font-size="26" data-label="8" data-left="448" data-right="752">Reserva no orçamento</text><text x="831" y="219" font-size="26" data-label="9" data-left="831" data-right="1135">Conferir o custo</text></g>
<g fill="#536c61" font-size="20"><text x="65" y="260" font-size="20" data-label="10" data-left="65" data-right="369">Confira o orçamento,</text><text x="65" y="292" font-size="20" data-label="11" data-left="65" data-right="369">as tentativas e o prazo.</text><text x="448" y="260" font-size="20" data-label="12" data-left="448" data-right="752">Use os preços configurados</text><text x="448" y="292" font-size="20" data-label="13" data-left="448" data-right="752">e o teto de custo declarado.</text><text x="831" y="260" font-size="20" data-label="14" data-left="831" data-right="1135">Registre gastos confirmados</text><text x="831" y="292" font-size="20" data-label="15" data-left="831" data-right="1135">e separe os casos incertos.</text></g>
<rect x="42" y="357" width="1116" height="78" rx="12" fill="#fff3db" stroke="#e7d4a8" /><text x="65" y="389" font-size="22" font-weight="700" fill="#725321" data-label="16" data-left="65" data-right="1135">Não sabe como terminou a solicitação? Mantenha a reserva.</text><text x="65" y="418" font-size="20" fill="#725321" data-label="17" data-left="65" data-right="1135">A plataforma não envia essa solicitação de novo automaticamente.</text>
<text x="42" y="480" font-size="19" fill="#536c61" data-label="18" data-left="42" data-right="1158">Tarifa local de API zero não significa hardware gratuito nem resultado confirmado.</text>
</g></svg>
