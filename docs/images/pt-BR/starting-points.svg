<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="670" viewBox="0 0 1200 670" role="img" aria-labelledby="title desc" lang="pt-BR">
<title id="title">Duas formas de trabalhar com agentes</title><desc id="desc">LangChain, LangGraph, Deep Agents e DeepSeek Harness ajudam a criar ou personalizar agentes. RunVerge oferece tarefas, revisão, resultados salvos e orçamentos. Os recursos se sobrepõem.</desc>
<rect x="1" y="1" width="1198" height="668" rx="22" fill="#f5f8f6" stroke="#d8e4dd" />
<g font-family="Arial, Helvetica, sans-serif">
<text x="42" y="59" font-size="34" font-weight="700" fill="#18352c" data-label="2" data-left="42" data-right="1158">Crie o agente ou trabalhe com as respostas</text>
<text x="42" y="98" font-size="22" fill="#536c61" data-label="3" data-left="42" data-right="1158">Escolha a ferramenta para a parte que você quer criar.</text>
<rect x="42" y="135" width="540" height="441" rx="16" fill="#ffffff" stroke="#d8e4dd" /><rect x="608" y="135" width="550" height="441" rx="16" fill="#153d32" />
<text x="68" y="175" font-size="17" letter-spacing="1" font-weight="700" fill="#64776d" data-label="4" data-left="68" data-right="556">CRIAR O AGENTE</text><text x="68" y="216" font-size="29" font-weight="700" fill="#18352c" data-label="5" data-left="68" data-right="556">Escolha como ele trabalha</text>
<g fill="#18352c" font-size="23" font-weight="700"><text x="68" y="272" font-size="23" data-label="6" data-left="68" data-right="556">LangChain</text><text x="68" y="346" font-size="23" data-label="7" data-left="68" data-right="556">LangGraph</text><text x="68" y="420" font-size="23" data-label="8" data-left="68" data-right="556">Deep Agents</text><text x="68" y="494" font-size="23" data-label="9" data-left="68" data-right="556">DeepSeek Harness</text></g>
<g fill="#536c61" font-size="20"><text x="68" y="302" font-size="20" data-label="10" data-left="68" data-right="556">Modelos, ferramentas e ciclo do agente</text><text x="68" y="376" font-size="20" data-label="11" data-left="68" data-right="556">Fluxos que preservam seu estado</text><text x="68" y="450" font-size="20" data-label="12" data-left="68" data-right="556">Planejamento, subagentes e arquivos</text><text x="68" y="524" font-size="20" data-label="13" data-left="68" data-right="556">Plugins e interface no navegador</text></g>
<text x="636" y="175" font-size="17" letter-spacing="1" font-weight="700" fill="#9cddbd" data-label="14" data-left="636" data-right="1130">USAR OS RESULTADOS</text><text x="636" y="216" font-size="29" font-weight="700" fill="#ffffff" data-label="15" data-left="636" data-right="1130">RunVerge alpha.2</text>
<text x="636" y="264" font-size="22" fill="#c3e0d1" data-label="16" data-left="636" data-right="1130">Interface web + API + CLI + SDK</text>
<g fill="#235744" stroke="#4b826a"><rect x="636" y="295" width="230" height="74" rx="10" /><rect x="884" y="295" width="246" height="74" rx="10" /><rect x="636" y="386" width="230" height="74" rx="10" /><rect x="884" y="386" width="246" height="74" rx="10" /></g>
<g fill="#ffffff" font-size="23" font-weight="700" text-anchor="middle"><text x="751" y="340" font-size="21" data-label="17" data-left="652" data-right="850">Tarefas e respostas</text><text x="1007" y="340" font-size="23" data-label="18" data-left="900" data-right="1114">Decisões</text><text x="751" y="431" font-size="23" data-label="19" data-left="652" data-right="850">Histórico</text><text x="1007" y="431" font-size="23" data-label="20" data-left="900" data-right="1114">Orçamentos</text></g>
<text x="636" y="502" font-size="21" fill="#c3e0d1" data-label="21" data-left="636" data-right="1130">Resultados e histórico no PostgreSQL</text><text x="636" y="539" font-size="19" fill="#9cddbd" data-label="22" data-left="636" data-right="1130">Pacote verificado: um proprietário, macOS arm64</text>
<text x="42" y="615" font-size="19" fill="#536c61" data-label="23" data-left="42" data-right="1158">Outros ecossistemas também oferecem persistência, revisão humana e implantação gerenciada.</text>
<text x="42" y="644" font-size="17" fill="#64776d" data-label="24" data-left="42" data-right="1158">A tabela compara os usos principais; não é um ranking de desempenho.</text>
