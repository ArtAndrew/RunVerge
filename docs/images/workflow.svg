<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">RunVerge: AI drafts, human review, retained history</title>
<desc id="desc">Assign a task and limits, generate a draft, review it, optionally approve a new attempt, then accept or reject. Keep attempts, track budgets, use a local model. Experimental alpha.1.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#10252c"/><stop offset="1" stop-color="#183c38"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L7 4L0 8" fill="none" stroke="#75c9a5" stroke-width="1.5"/></marker></defs>
<rect width="1200" height="680" rx="24" fill="url(#bg)"/>
<g font-family="Arial, Helvetica, sans-serif">
<path d="M48 60V38M59 66V32M70 60V26" stroke="#77e0b3" stroke-width="7" stroke-linecap="round"/>
<text x="90" y="57" fill="#d5f7e9" font-size="28" font-weight="700">RunVerge</text>
<rect x="918" y="30" width="234" height="40" rx="20" fill="#284d45"/><text x="1035" y="56" text-anchor="middle" fill="#a9e8cd" font-size="17" font-weight="700">EXPERIMENTAL ALPHA.1</text>
<text x="48" y="138" fill="#ffffff" font-size="48" font-weight="700">AI work you can review.</text>
<text x="48" y="183" fill="#b6d3ca" font-size="25">From a task to a result you choose to accept.</text>
<g fill="#193b3b" stroke="#3a6158"><rect x="48" y="237" width="196" height="162" rx="16"/><rect x="275" y="237" width="196" height="162" rx="16"/><rect x="502" y="237" width="196" height="162" rx="16"/><rect x="729" y="237" width="196" height="162" rx="16"/><rect x="956" y="237" width="196" height="162" rx="16"/></g>
<g fill="#8de2bb" font-size="19" font-weight="700"><text x="69" y="272">01 / ASSIGN</text><text x="296" y="272">02 / GENERATE</text><text x="523" y="272">03 / REVIEW</text><text x="750" y="272">04 / IF NEEDED</text><text x="977" y="272">05 / DECIDE</text></g>
<g fill="#ffffff" font-size="26" font-weight="700"><text x="69" y="321">Task + limits</text><text x="296" y="321">Model draft</text><text x="523" y="321">Your review</text><text x="750" y="321">New attempt</text><text x="977" y="321">Your decision</text></g>
<g fill="#b6d3ca" font-size="20"><text x="69" y="362">Define the result</text><text x="296" y="362">Keep the original</text><text x="523" y="362">Check the facts</text><text x="750" y="362">Consent required</text><text x="977" y="362">Accept or reject</text></g>
<g stroke="#75c9a5" stroke-width="2" marker-end="url(#arrow)"><path d="M248 318H267"/><path d="M475 318H494"/><path d="M702 318H721"/><path d="M929 318H948"/></g>
<text x="48" y="441" fill="#b6d3ca" font-size="21">Accept the first draft, or request a separately approved revision.</text><path d="M48 479H1152" stroke="#36594f"/>
<g fill="#ffffff" font-size="24" font-weight="700"><text x="48" y="533">Keep every attempt</text><text x="427" y="533">Track limits and costs</text><text x="806" y="533">Use a local model</text></g>
<g fill="#b6d3ca" font-size="20"><text x="48" y="570">Originals and feedback stay</text><text x="48" y="601">connected to the task.</text><text x="427" y="570">Reservations and uncertain</text><text x="427" y="601">outcomes remain visible.</text><text x="806" y="570">One owner, local installation,</text><text x="806" y="601">Russian or English UI.</text></g>
<text x="48" y="648" fill="#a5c8ba" font-size="16">Current alpha: macOS arm64 · PostgreSQL and model server configured separately · test data only</text>
</g></svg>
