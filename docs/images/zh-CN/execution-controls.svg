<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">任务预算与请求状态</title><desc id="desc">执行前检查权限、预算和限制，按照配置的价格预留任务预算。确认费用与未知结果分别记录；请求结果不明确时保留预留金额。这是任务内部的预算记录，不是银行账户冻结。</desc>
<rect x="1" y="1" width="1198" height="518" rx="22" fill="#f5f8f6" stroke="#d8e4dd" />
<g font-family="Arial, Helvetica, sans-serif">
<text x="42" y="59" font-size="34" font-weight="700" fill="#18352c" data-label="2" data-left="42" data-right="1158">开始前先设置预算</text><text x="42" y="99" font-size="22" fill="#536c61" data-label="3" data-left="42" data-right="1158">查看已花费金额，以及仍需核对的项目。</text>
<g fill="#ffffff" stroke="#d8e4dd"><rect x="42" y="140" width="350" height="185" rx="14" /><rect x="425" y="140" width="350" height="185" rx="14" /><rect x="808" y="140" width="350" height="185" rx="14" /></g>
<g fill="#478469" font-size="17" font-weight="700" letter-spacing="1"><text x="65" y="174" font-size="17" data-label="4" data-left="65" data-right="369">执行前</text><text x="448" y="174" font-size="17" data-label="5" data-left="448" data-right="752">执行时</text><text x="831" y="174" font-size="17" data-label="6" data-left="831" data-right="1135">执行后</text></g>
<g fill="#18352c" font-size="26" font-weight="700"><text x="65" y="219" font-size="26" data-label="7" data-left="65" data-right="369">权限与限制</text><text x="448" y="219" font-size="26" data-label="8" data-left="448" data-right="752">预留任务预算</text><text x="831" y="219" font-size="26" data-label="9" data-left="831" data-right="1135">核对费用</text></g>
<g fill="#536c61" font-size="20"><text x="65" y="260" font-size="20" data-label="10" data-left="65" data-right="369">检查任务预算、</text><text x="65" y="292" font-size="20" data-label="11" data-left="65" data-right="369">执行次数和截止时间。</text><text x="448" y="260" font-size="20" data-label="12" data-left="448" data-right="752">使用已配置的价格</text><text x="448" y="292" font-size="20" data-label="13" data-left="448" data-right="752">和声明的费用上限。</text><text x="831" y="260" font-size="20" data-label="14" data-left="831" data-right="1135">记录已确认费用，</text><text x="831" y="292" font-size="20" data-label="15" data-left="831" data-right="1135">单独保留不确定项目。</text></g>
<rect x="42" y="357" width="1116" height="78" rx="12" fill="#fff3db" stroke="#e7d4a8" /><text x="65" y="389" font-size="22" font-weight="700" fill="#725321" data-label="16" data-left="65" data-right="1135">不清楚已发送请求的结果？保留其预留金额。</text><text x="65" y="418" font-size="20" fill="#725321" data-label="17" data-left="65" data-right="1135">平台不会自动再次发送该请求。</text>
<text x="42" y="480" font-size="19" fill="#536c61" data-label="18" data-left="42" data-right="1158">本地 API 费率为零不代表硬件免费，也不代表结果已确认。</text>
</g></svg>
