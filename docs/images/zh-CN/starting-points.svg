<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="670" viewBox="0 0 1200 670" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">两种使用智能体的方式</title><desc id="desc">LangChain、LangGraph、Deep Agents 和 DeepSeek Harness 帮助开发或定制智能体。RunVerge 提供任务页面、审核决定、已保存结果和预算。这些能力存在重叠。</desc>
<rect x="1" y="1" width="1198" height="668" rx="22" fill="#f5f8f6" stroke="#d8e4dd" />
<g font-family="Arial, Helvetica, sans-serif">
<text x="42" y="59" font-size="34" font-weight="700" fill="#18352c" data-label="2" data-left="42" data-right="1158">开发智能体，或处理它的回答</text>
<text x="42" y="98" font-size="22" fill="#536c61" data-label="3" data-left="42" data-right="1158">根据你想自行开发的部分选择工具。</text>
<rect x="42" y="135" width="540" height="441" rx="16" fill="#ffffff" stroke="#d8e4dd" /><rect x="608" y="135" width="550" height="441" rx="16" fill="#153d32" />
<text x="68" y="175" font-size="17" letter-spacing="1" font-weight="700" fill="#64776d" data-label="4" data-left="68" data-right="556">开发智能体</text><text x="68" y="216" font-size="29" font-weight="700" fill="#18352c" data-label="5" data-left="68" data-right="556">决定智能体如何工作</text>
<g fill="#18352c" font-size="23" font-weight="700"><text x="68" y="272" font-size="23" data-label="6" data-left="68" data-right="556">LangChain</text><text x="68" y="346" font-size="23" data-label="7" data-left="68" data-right="556">LangGraph</text><text x="68" y="420" font-size="23" data-label="8" data-left="68" data-right="556">Deep Agents</text><text x="68" y="494" font-size="23" data-label="9" data-left="68" data-right="556">DeepSeek Harness</text></g>
<g fill="#536c61" font-size="20"><text x="68" y="302" font-size="20" data-label="10" data-left="68" data-right="556">模型、工具和智能体循环</text><text x="68" y="376" font-size="20" data-label="11" data-left="68" data-right="556">保存执行状态的工作流</text><text x="68" y="450" font-size="20" data-label="12" data-left="68" data-right="556">规划、子智能体和文件上下文</text><text x="68" y="524" font-size="20" data-label="13" data-left="68" data-right="556">插件和浏览器界面</text></g>
<text x="636" y="175" font-size="17" letter-spacing="1" font-weight="700" fill="#9cddbd" data-label="14" data-left="636" data-right="1130">处理生成结果</text><text x="636" y="216" font-size="29" font-weight="700" fill="#ffffff" data-label="15" data-left="636" data-right="1130">RunVerge alpha.6</text>
<text x="636" y="264" font-size="22" fill="#c3e0d1" data-label="16" data-left="636" data-right="1130">浏览器界面 + API + CLI + SDK</text>
<g fill="#235744" stroke="#4b826a"><rect x="636" y="295" width="230" height="74" rx="10" /><rect x="884" y="295" width="246" height="74" rx="10" /><rect x="636" y="386" width="230" height="74" rx="10" /><rect x="884" y="386" width="246" height="74" rx="10" /></g>
<g fill="#ffffff" font-size="23" font-weight="700" text-anchor="middle"><text x="751" y="340" font-size="23" data-label="17" data-left="652" data-right="850">任务与回答</text><text x="1007" y="340" font-size="23" data-label="18" data-left="900" data-right="1114">人工决定</text><text x="751" y="431" font-size="23" data-label="19" data-left="652" data-right="850">执行历史</text><text x="1007" y="431" font-size="23" data-label="20" data-left="900" data-right="1114">任务预算</text></g>
<text x="636" y="502" font-size="21" fill="#c3e0d1" data-label="21" data-left="636" data-right="1130">结果和历史记录保存在 PostgreSQL 中</text><text x="636" y="539" font-size="19" fill="#9cddbd" data-label="22" data-left="636" data-right="1130">所有者与成员 · 本地试用</text>
<text x="42" y="615" font-size="19" fill="#536c61" data-label="23" data-left="42" data-right="1158">其他生态同样提供持久化、人工审核和托管部署。</text>
<text x="42" y="644" font-size="17" fill="#64776d" data-label="24" data-left="42" data-right="1158">下表比较主要用途，不代表性能排名。</text>
</g></svg>
