<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">RunVerge 的任务与审核流程</title>
<desc id="desc">描述任务，获得草稿，检查后接受或批准修改。原始回答和修改意见保留在任务历史中。</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#10252c" /><stop offset="1" stop-color="#183c38" /></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L7 4L0 8" fill="none" stroke="#75c9a5" stroke-width="1.5" /></marker></defs>
<rect width="1200" height="680" rx="24" fill="url(#bg)" />
<g font-family="Arial, Helvetica, sans-serif">
<path d="M48 60V38M59 66V32M70 60V26" stroke="#77e0b3" stroke-width="7" stroke-linecap="round" />
<text x="90" y="57" fill="#d5f7e9" font-size="28" font-weight="700" data-label="2" data-left="90" data-right="350">RunVerge</text>
<rect x="918" y="30" width="234" height="40" rx="20" fill="#284d45" /><text x="1035" y="56" text-anchor="middle" fill="#a9e8cd" font-size="17" font-weight="700" data-label="3" data-left="930" data-right="1140">ALPHA.6 / 试用版</text>
<text x="48" y="138" fill="#ffffff" font-size="40" font-weight="700" data-label="4" data-left="48" data-right="1152">布置任务，检查结果。</text>
<text x="48" y="183" fill="#b6d3ca" font-size="25" data-label="5" data-left="48" data-right="1152">保留回答，以及用于修改回答的意见。</text>
<g fill="#193b3b" stroke="#3a6158"><rect x="48" y="237" width="196" height="162" rx="16" /><rect x="275" y="237" width="196" height="162" rx="16" /><rect x="502" y="237" width="196" height="162" rx="16" /><rect x="729" y="237" width="196" height="162" rx="16" /><rect x="956" y="237" width="196" height="162" rx="16" /></g>
<g fill="#8de2bb" font-size="19" font-weight="700"><text x="69" y="272" font-size="19" data-label="6" data-left="69" data-right="230">01 / 描述任务</text><text x="296" y="272" font-size="19" data-label="7" data-left="296" data-right="457">02 / 生成草稿</text><text x="523" y="272" font-size="19" data-label="8" data-left="523" data-right="684">03 / 检查结果</text><text x="750" y="272" font-size="19" data-label="9" data-left="750" data-right="911">04 / 按需修改</text><text x="977" y="272" font-size="19" data-label="10" data-left="977" data-right="1138">05 / 作出决定</text></g>
<g fill="#ffffff" font-size="26" font-weight="700"><text x="69" y="321" font-size="26" data-label="11" data-left="69" data-right="230">任务与限额</text><text x="296" y="321" font-size="26" data-label="12" data-left="296" data-right="457">模型草稿</text><text x="523" y="321" font-size="26" data-label="13" data-left="523" data-right="684">人工检查</text><text x="750" y="321" font-size="26" data-label="14" data-left="750" data-right="911">修改</text><text x="977" y="321" font-size="26" data-label="15" data-left="977" data-right="1138">最终决定</text></g>
<g fill="#b6d3ca" font-size="20"><text x="69" y="362" font-size="20" data-label="16" data-left="69" data-right="230">明确目标</text><text x="296" y="362" font-size="20" data-label="17" data-left="296" data-right="457">保存回答</text><text x="523" y="362" font-size="20" data-label="18" data-left="523" data-right="684">核对事实</text><text x="750" y="362" font-size="20" data-label="19" data-left="750" data-right="911">批准新一轮执行</text><text x="977" y="362" font-size="20" data-label="20" data-left="977" data-right="1138">接受或拒绝</text></g>
<g stroke="#75c9a5" stroke-width="2" marker-end="url(#arrow)"><path d="M248 318H267" /><path d="M475 318H494" /><path d="M702 318H721" /><path d="M929 318H948" /></g>
<text x="48" y="441" fill="#b6d3ca" font-size="21" data-label="21" data-left="48" data-right="1152">接受草稿，或留下意见并单独批准新一轮执行。</text><path d="M48 479H1152" stroke="#36594f" />
<g fill="#ffffff" font-size="24" font-weight="700"><text x="48" y="533" font-size="24" data-label="22" data-left="48" data-right="378">保留两个版本</text><text x="427" y="533" font-size="24" data-label="23" data-left="427" data-right="757">设置任务预算</text><text x="806" y="533" font-size="24" data-label="24" data-left="806" data-right="1136">你自己的安装</text></g>
<g fill="#b6d3ca" font-size="20"><text x="48" y="570" font-size="20" data-label="25" data-left="48" data-right="378">修改后仍可查看</text><text x="48" y="601" font-size="20" data-label="26" data-left="48" data-right="378">原始回答。</text><text x="427" y="570" font-size="20" data-label="27" data-left="427" data-right="757">查看已确认费用</text><text x="427" y="601" font-size="20" data-label="28" data-left="427" data-right="757">以及仍待核对的金额。</text><text x="806" y="570" font-size="20" data-label="29" data-left="806" data-right="1136">通过浏览器界面</text><text x="806" y="601" font-size="20" data-label="30" data-left="806" data-right="1136">与智能体一起工作。</text></g>
<text x="48" y="648" fill="#a5c8ba" font-size="16" data-label="31" data-left="48" data-right="1152">Alpha.6 · 本地测试数据试用 · PostgreSQL 和模型需单独配置</text>
</g></svg>
